<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="%PUBLIC_URL%/images/Logo.svg"
      type="image/svg+xml"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#495E57" />
    <meta
      name="description"
      content="Little Lemon is a charming neighborhood bistro in Chicago serving simple, fresh and bold Mediterranean-inspired food. Book a table, browse the menu, or order online."
    />
    <meta property="og:title" content="Little Lemon Restaurant" />
    <meta
      property="og:description"
      content="Little Lemon is a charming neighborhood bistro in Chicago serving simple, fresh and bold Mediterranean-inspired food. Book a table, browse the menu, or order online."
    />
    <meta
      property="og:image"
      content="https://little-lemon.example.com/images/og-image.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&family=Markazi+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Little Lemon booking API (window.fetchAPI / window.submitAPI).
         The exercise points at
         https://raw.githubusercontent.com/courseraap/capstone/main/api.js,
         but GitHub serves raw files as text/plain (with nosniff), so browsers
         refuse to execute them as scripts. The same API code is vendored
         locally in public/api.js instead. -->
    <script src="%PUBLIC_URL%/api.js"></script>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Little Lemon</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
